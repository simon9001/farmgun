    rel="stylesheet" />

  <!--
    Structured data. This is the part that actually tells Google which image is
    the brand logo, rather than leaving it to guess. Google reads `logo` from an
    Organization entity for the knowledge panel and brand treatments.
    Reference: https://developers.google.com/search/docs/appearance/structured-data/logo
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://farmwithirene.com/#organization",
    "name": "Farm with Irene",
    "alternateName": "FarmWithIrene",
    "url": "https://farmwithirene.com/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://farmwithirene.com/logo.png",
      "width": 231,
      "height": 231,

    },
    "image": "https://farmwithirene.com/og-image.jpg",
    "description": "Agricultural consultancy in Kenya specialising in onion and garlic production, from land preparation and irrigation design through to harvest and market linkage.",

    },
    "areaServed": {

      "name": "Kenya"
    },
